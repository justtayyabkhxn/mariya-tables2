<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariya's Magic Tables ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fc7;
    --pink-deep: #ff4fa3;
    --lilac: #c9a7ff;
    --text: #6b2c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffe1f0 0%, #f3e1ff 50%, #e1f0ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(8px, 2vh, 20px) 16px;
    gap: clamp(6px, 1.6vh, 16px);
  }

  /* ---------- cute floating friends ---------- */
  .float {
    position: fixed;
    bottom: -60px;
    pointer-events: none;
    z-index: 0;
    animation: rise linear infinite;
  }
  .float span {
    display: block;
    animation: sway ease-in-out infinite alternate, squish 1.6s ease-in-out infinite;
    filter: drop-shadow(0 3px 4px rgba(255, 105, 180, .35));
  }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    8%   { opacity: .95; }
    90%  { opacity: .95; }
    100% { transform: translateY(calc(-100vh - 120px)); opacity: 0; }
  }
  @keyframes sway {
    from { transform: translateX(-22px) rotate(-14deg); }
    to   { transform: translateX(22px) rotate(14deg); }
  }
  @keyframes squish {
    0%, 100% { scale: 1; }
    50% { scale: 1.15 .9; }
  }

  /* twinkly stars that sit still and blink */
  .twinkle {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    color: #fff;
    text-shadow: 0 0 8px #ffb6e1, 0 0 14px #d9b8ff;
    animation: blink ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: .15; transform: scale(.6) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
  }

  /* puffy clouds drifting across */
  .cloud {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    left: -160px;
    width: 120px; height: 40px;
    background: #fff;
    border-radius: 999px;
    opacity: .75;
    animation: drift linear infinite;
    box-shadow: 0 6px 14px rgba(255, 150, 200, .2);
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 54px; height: 54px; top: -28px; left: 16px; }
  .cloud::after  { width: 40px; height: 40px; top: -18px; left: 60px; }
  @keyframes drift { to { transform: translateX(calc(100vw + 320px)); } }

  /* ---------- header ---------- */
  header { text-align: center; position: relative; z-index: 1; flex-shrink: 0; }
  h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.8rem, 6.5vh, 3.6rem);
    line-height: 1.2;
    background: linear-gradient(90deg, var(--pink-deep), var(--lilac), var(--pink-deep));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
    filter: drop-shadow(0 3px 0 #fff);
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .subtitle { font-size: clamp(.85rem, 2.2vh, 1.15rem); font-weight: 700; }

  /* ---------- number buttons (one line) ---------- */
  .buttons {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: clamp(4px, 1.2vw, 12px);
    width: 100%;
    max-width: min(820px, 90vh);
    flex-shrink: 0;
    padding-top: 14px;
  }
  .btn {
    font-family: 'Pacifico', cursive;
    font-size: clamp(.95rem, 3.2vw, 1.7rem);
    aspect-ratio: 1;
    width: 100%;
    border: clamp(2px, .4vw, 3px) solid #fff;
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 4px rgba(150, 30, 100, .35);
    box-shadow: 0 5px 0 rgba(200, 80, 150, .35), 0 8px 16px rgba(255, 120, 190, .3);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
    position: relative;
  }
  .btn:nth-child(5n+1) { background: linear-gradient(145deg, #ff9ecf, #ff5fae); }
  .btn:nth-child(5n+2) { background: linear-gradient(145deg, #d6b4ff, #a97bff); }
  .btn:nth-child(5n+3) { background: linear-gradient(145deg, #ffb8d9, #ff83b8); }
  .btn:nth-child(5n+4) { background: linear-gradient(145deg, #ffc6a8, #ff8fa3); }
  .btn:nth-child(5n+5) { background: linear-gradient(145deg, #b8d8ff, #c49cff); }
  .btn:hover { transform: translateY(-4px) scale(1.1) rotate(-6deg); }
  .btn:active { transform: translateY(3px) scale(.95); box-shadow: 0 2px 0 rgba(200, 80, 150, .35); }
  .btn.active { outline: 3px dashed var(--pink-deep); outline-offset: 3px; transform: scale(1.1); }
  .btn.active::after {
    content: '👑';
    position: absolute; top: -0.9em; left: 50%;
    transform: translateX(-50%);
    font-size: .7em;
    text-shadow: none;
  }

  /* ---------- table card ---------- */
  .card {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 520px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, .75);
    backdrop-filter: blur(8px);
    border: 3px solid #fff;
    border-radius: 28px;
    padding: clamp(10px, 2vh, 22px) clamp(12px, 3vw, 22px);
    box-shadow: 0 20px 50px rgba(255, 100, 180, .25);
    text-align: center;
  }
  .placeholder {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: clamp(1rem, 2.6vh, 1.25rem); font-weight: 700;
  }
  .placeholder span { font-size: clamp(2.4rem, 8vh, 4rem); display: block; animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-10px) rotate(6deg); } }

  .card h2 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.2rem, 3.6vh, 2rem);
    line-height: 1.3;
    color: var(--pink-deep);
    margin-bottom: clamp(4px, 1vh, 12px);
    flex-shrink: 0;
  }
  .rows {
    list-style: none;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(10, 1fr);
    gap: clamp(3px, .8vh, 8px);
  }
  .rows li {
    display: flex; justify-content: space-between; align-items: center;
    min-height: 0;
    background: linear-gradient(90deg, #fff0f7, #f7edff);
    border-radius: 999px;
    padding: 0 clamp(12px, 3vw, 22px);
    font-size: clamp(.85rem, 2.5vh, 1.3rem);
    font-weight: 700;
    opacity: 0;
    transform: translateX(-30px) scale(.9);
    animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards;
    cursor: pointer;
    transition: background .2s;
  }
  .rows li:hover { background: linear-gradient(90deg, #ffd6ea, #ead6ff); }
  .rows li .ans {
    background: var(--pink-deep);
    color: #fff;
    border-radius: 999px;
    min-width: 3.2em;
    padding: .05em .8em;
  }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .hidden-mode .rows li .ans { color: transparent; background: var(--lilac); }
  .hidden-mode .rows li.shown .ans { color: #fff; background: var(--pink-deep); }

  .toggle {
    flex-shrink: 0;
    align-self: center;
    margin-top: clamp(6px, 1.4vh, 14px);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(.8rem, 2vh, 1rem);
    border: none;
    border-radius: 999px;
    padding: .55em 1.4em;
    background: linear-gradient(90deg, var(--lilac), var(--pink));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(160, 90, 200, .35);
  }
  .toggle:active { transform: translateY(2px); }

  footer { text-align: center; font-weight: 700; font-size: clamp(.75rem, 1.8vh, .95rem); position: relative; z-index: 1; flex-shrink: 0; }

  .burst {
    position: fixed; pointer-events: none; z-index: 10;
    font-size: 20px;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }
</style>
</head>
<body>
  <header>
    <h1>Magic Tables</h1>
    <p class="subtitle">🎀 Tap a number to reveal its table 🎀</p>
  </header>

  <div class="buttons" id="buttons"></div>

  <div class="card" id="card">
    <div class="placeholder"><span>🦄</span>Pick a number, cutie! 💕</div>
  </div>

  <footer>made with 💖 &amp; sparkles</footer>

<script>
  const emojis = ['💖','🌸','✨','🎀','🦋','🌷','💕','⭐','🍓','🧁'];
  const buttons = document.getElementById('buttons');
  const card = document.getElementById('card');
  let quizMode = false;
  let current = null;

  for (let n = 1; n <= 10; n++) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = n;
    b.setAttribute('aria-label', 'Show table of ' + n);
    b.addEventListener('click', e => { showTable(n, b); burst(e.clientX, e.clientY); });
    buttons.appendChild(b);
  }

  function showTable(n, btn) {
    current = n;
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    const emoji = emojis[n - 1];
    let html = `<h2>${emoji} Table of ${n} ${emoji}</h2><ul class="rows">`;
    for (let i = 1; i <= 10; i++) {
      html += `<li style="animation-delay:${i * 0.06}s">
        <span>${n} × ${i} =</span>
        <span class="ans">${n * i}</span>
      </li>`;
    }
    html += `</ul><button class="toggle" id="toggle">${quizMode ? '👀 Show all answers' : '🙈 Quiz me (hide answers)'}</button>`;
    card.innerHTML = html;
    card.classList.toggle('hidden-mode', quizMode);

    card.querySelectorAll('.rows li').forEach(li => {
      li.addEventListener('click', e => {
        if (quizMode) { li.classList.add('shown'); burst(e.clientX, e.clientY); }
      });
    });
    document.getElementById('toggle').addEventListener('click', () => {
      quizMode = !quizMode;
      showTable(current, btn);
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'burst';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  // cute floating friends that sway and squish as they rise
  const friends = ['🐰','🧸','🦄','🐱','🍭','🌈','🎀','💝','🍬','🦋','🌸','🐣','🍓','🧁','💗','🐼','🌷','🍰','🐥','💫'];
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('div');
    f.className = 'float';
    f.style.left = Math.random() * 96 + 'vw';
    f.style.animationDuration = 12 + Math.random() * 14 + 's';
    f.style.animationDelay = -Math.random() * 26 + 's';
    const s = document.createElement('span');
    s.textContent = friends[i % friends.length];
    s.style.fontSize = 18 + Math.random() * 22 + 'px';
    s.style.animationDuration = (1.8 + Math.random() * 2) + 's, ' + (1.2 + Math.random()) + 's';
    f.appendChild(s);
    document.body.appendChild(f);
  }

  // twinkling stars
  for (let i = 0; i < 22; i++) {
    const t = document.createElement('div');
    t.className = 'twinkle';
    t.textContent = '✦';
    t.style.left = Math.random() * 100 + 'vw';
    t.style.top = Math.random() * 100 + 'vh';
    t.style.fontSize = 8 + Math.random() * 14 + 'px';
    t.style.animationDuration = 1.5 + Math.random() * 2.5 + 's';
    t.style.animationDelay = -Math.random() * 4 + 's';
    document.body.appendChild(t);
  }

  // puffy drifting clouds
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = 8 + Math.random() * 80 + 'vh';
    c.style.transform = 'scale(' + (0.6 + Math.random() * 0.7) + ')';
    c.style.animationDuration = 40 + Math.random() * 30 + 's';
    c.style.animationDelay = -Math.random() * 60 + 's';
    document.body.appendChild(c);
  }
</script>
</body>
</html>
