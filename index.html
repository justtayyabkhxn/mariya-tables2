<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariya's Magic Tables ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fc7;
    --pink-deep: #ff4fa3;
    --lilac: #c9a7ff;
    --peach: #ffd6e7;
    --cream: #fff6fb;
    --text: #6b2c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe1f0 0%, #f3e1ff 50%, #e1f0ff 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    padding: 24px 16px 60px;
  }

  /* floating hearts & sparkles */
  .float {
    position: fixed;
    pointer-events: none;
    font-size: 22px;
    opacity: .7;
    animation: rise linear infinite;
    z-index: 0;
  }
  @keyframes rise {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: .8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  header { text-align: center; position: relative; z-index: 1; margin-bottom: 28px; }
  h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.2rem, 7vw, 4rem);
    background: linear-gradient(90deg, var(--pink-deep), var(--lilac), var(--pink-deep));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
    filter: drop-shadow(0 3px 0 #fff);
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .subtitle { font-size: 1.15rem; margin-top: 6px; font-weight: 700; }

  .buttons {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    max-width: 640px;
    margin: 0 auto 32px;
  }
  .btn {
    font-family: 'Pacifico', cursive;
    font-size: 1.8rem;
    aspect-ratio: 1;
    border: 3px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 2px 4px rgba(150, 30, 100, .35);
    box-shadow: 0 6px 0 rgba(200, 80, 150, .35), 0 10px 20px rgba(255, 120, 190, .3);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
    position: relative;
  }
  .btn:nth-child(5n+1) { background: linear-gradient(145deg, #ff9ecf, #ff5fae); }
  .btn:nth-child(5n+2) { background: linear-gradient(145deg, #d6b4ff, #a97bff); }
  .btn:nth-child(5n+3) { background: linear-gradient(145deg, #ffb8d9, #ff83b8); }
  .btn:nth-child(5n+4) { background: linear-gradient(145deg, #ffc6a8, #ff8fa3); }
  .btn:nth-child(5n+5) { background: linear-gradient(145deg, #b8d8ff, #c49cff); }
  .btn:hover { transform: translateY(-4px) scale(1.08) rotate(-4deg); }
  .btn:active { transform: translateY(3px) scale(.96); box-shadow: 0 2px 0 rgba(200, 80, 150, .35); }
  .btn.active { outline: 4px dashed var(--pink-deep); outline-offset: 4px; transform: scale(1.1); }
  .btn.active::after {
    content: '👑';
    position: absolute; top: -18px; left: 50%;
    transform: translateX(-50%);
    font-size: 1.3rem;
    text-shadow: none;
  }

  .card {
    position: relative; z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    background: rgba(255, 255, 255, .75);
    backdrop-filter: blur(8px);
    border: 3px solid #fff;
    border-radius: 32px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(255, 100, 180, .25);
    text-align: center;
  }
  .placeholder { font-size: 1.2rem; font-weight: 700; padding: 30px 0; }
  .placeholder span { font-size: 3rem; display: block; animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-10px); } }

  .card h2 {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: var(--pink-deep);
    margin-bottom: 16px;
  }
  .rows { list-style: none; display: grid; gap: 8px; }
  .rows li {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(90deg, #fff0f7, #f7edff);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 1.3rem;
    font-weight: 700;
    opacity: 0;
    transform: translateX(-30px) scale(.9);
    animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards;
    cursor: pointer;
    transition: background .2s;
  }
  .rows li:hover { background: linear-gradient(90deg, #ffd6ea, #ead6ff); }
  .rows li .ans {
    background: var(--pink-deep);
    color: #fff;
    border-radius: 999px;
    min-width: 56px;
    padding: 2px 14px;
  }
  .rows li .heart { font-size: 1rem; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .hidden-mode .rows li .ans { color: transparent; background: var(--lilac); }
  .hidden-mode .rows li.shown .ans { color: #fff; background: var(--pink-deep); }

  .toggle {
    margin-top: 18px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    background: linear-gradient(90deg, var(--lilac), var(--pink));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(160, 90, 200, .35);
  }
  .toggle:active { transform: translateY(2px); }

  footer { text-align: center; margin-top: 30px; font-weight: 700; position: relative; z-index: 1; }

  .burst {
    position: fixed; pointer-events: none; z-index: 10;
    font-size: 20px;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }

  @media (max-width: 480px) {
    .buttons { gap: 10px; }
    .btn { font-size: 1.4rem; }
    .rows li { font-size: 1.1rem; padding: 8px 16px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Magic Tables</h1>
    <p class="subtitle">🎀 Tap a number to reveal its table 🎀</p>
  </header>

  <div class="buttons" id="buttons"></div>

  <div class="card" id="card">
    <div class="placeholder"><span>🦄</span>Pick a number, cutie! 💕</div>
  </div>

  <footer>made with 💖 &amp; sparkles</footer>

<script>
  const emojis = ['💖','🌸','✨','🎀','🦋','🌷','💕','⭐','🍓','🧁'];
  const buttons = document.getElementById('buttons');
  const card = document.getElementById('card');
  let quizMode = false;
  let current = null;

  for (let n = 1; n <= 10; n++) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = n;
    b.setAttribute('aria-label', 'Show table of ' + n);
    b.addEventListener('click', e => { showTable(n, b); burst(e.clientX, e.clientY); });
    buttons.appendChild(b);
  }

  function showTable(n, btn) {
    current = n;
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    const emoji = emojis[n - 1];
    let html = `<h2>${emoji} Table of ${n} ${emoji}</h2><ul class="rows">`;
    for (let i = 1; i <= 10; i++) {
      html += `<li style="animation-delay:${i * 0.06}s">
        <span>${n} × ${i} =</span>
        <span class="ans">${n * i}</span>
      </li>`;
    }
    html += `</ul><button class="toggle" id="toggle">${quizMode ? '👀 Show all answers' : '🙈 Quiz me (hide answers)'}</button>`;
    card.innerHTML = html;
    card.classList.toggle('hidden-mode', quizMode);

    card.querySelectorAll('.rows li').forEach(li => {
      li.addEventListener('click', e => {
        if (quizMode) { li.classList.add('shown'); burst(e.clientX, e.clientY); }
      });
    });
    document.getElementById('toggle').addEventListener('click', () => {
      quizMode = !quizMode;
      showTable(current, btn);
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('div');
      s.className = 'burst';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  // floating background hearts
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('div');
    f.className = 'float';
    f.textContent = ['💗','🌸','✨','🎀','🦋'][i % 5];
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = 14 + Math.random() * 20 + 'px';
    f.style.animationDuration = 10 + Math.random() * 14 + 's';
    f.style.animationDelay = -Math.random() * 20 + 's';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
