<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro's Starry Tables 🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #120d33;
    --night-2: #231a5e;
    --night-3: #3a2c8c;
    --cyan: #8ff3ee;
    --cyan-deep: #4fd8d2;
    --cap: #7d6ff0;
    --cap-deep: #5a4bd1;
    --star: #ffe27a;
    --text: #eaf9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Fredoka', 'Segoe UI', sans-serif;
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(circle at 85% 12%, rgba(143, 243, 238, .18), transparent 30%),
      radial-gradient(circle at 10% 90%, rgba(125, 111, 240, .35), transparent 40%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(8px, 1.8vh, 18px) 16px;
    gap: clamp(6px, 1.4vh, 14px);
  }

  /* ---------- night sky ---------- */
  .twinkle {
    position: fixed; pointer-events: none; z-index: 0;
    color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 14px var(--cyan);
    animation: blink ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: .15; transform: scale(.6) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
  }

  .shooting {
    position: fixed; pointer-events: none; z-index: 0;
    width: 140px; height: 2px;
    background: linear-gradient(90deg, #fff, transparent);
    border-radius: 2px;
    filter: drop-shadow(0 0 6px var(--cyan));
    transform: rotate(-30deg);
    opacity: 0;
    animation: shoot 7s ease-in infinite;
  }
  @keyframes shoot {
    0%   { opacity: 0; translate: 0 0; }
    3%   { opacity: 1; }
    14%  { opacity: 0; translate: -420px 240px; }
    100% { opacity: 0; translate: -420px 240px; }
  }

  .float {
    position: fixed; bottom: -80px; pointer-events: none; z-index: 0;
    animation: rise linear infinite;
  }
  .float > * {
    display: block;
    animation: sway ease-in-out infinite alternate;
    filter: drop-shadow(0 0 8px rgba(143, 243, 238, .45));
  }
  .float img { width: 100%; border-radius: 50%; }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    8%   { opacity: .9; }
    90%  { opacity: .9; }
    100% { transform: translateY(calc(-100vh - 160px)); opacity: 0; }
  }
  @keyframes sway {
    from { transform: translateX(-20px) rotate(-15deg); }
    to   { transform: translateX(20px) rotate(15deg); }
  }

  /* ---------- header with Astro ---------- */
  header {
    position: relative; z-index: 1; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(8px, 2vw, 20px);
  }
  .astro-wrap { position: relative; flex-shrink: 0; }
  .astro {
    height: clamp(64px, 15vh, 140px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(143, 243, 238, .35), transparent 70%);
    animation: snooze 3.2s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(143, 243, 238, .55));
    cursor: pointer;
  }
  @keyframes snooze {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }
  .zzz {
    position: absolute; top: 0; right: -6px;
    font-weight: 700; color: var(--cyan);
    font-size: clamp(.8rem, 2vh, 1.1rem);
  }
  .zzz span { position: absolute; opacity: 0; animation: zz 3s ease-out infinite; }
  .zzz span:nth-child(2) { animation-delay: 1s; }
  .zzz span:nth-child(3) { animation-delay: 2s; }
  @keyframes zz {
    0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(22px, -36px) scale(1.3); }
  }

  .titles { text-align: left; }
  h1 {
    font-size: clamp(1.6rem, 5.6vh, 3.2rem);
    line-height: 1.05;
    font-weight: 700;
    background: linear-gradient(90deg, var(--cyan), #c9c2ff, var(--star), var(--cyan));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    filter: drop-shadow(0 3px 0 var(--cap-deep));
  }
  @keyframes shimmer { to { background-position: 300% center; } }
  .bubble {
    display: inline-block;
    margin-top: clamp(4px, .8vh, 8px);
    background: rgba(255, 255, 255, .12);
    border: 2px solid rgba(143, 243, 238, .5);
    border-radius: 16px;
    padding: .25em .8em;
    font-size: clamp(.8rem, 2vh, 1.05rem);
    font-weight: 600;
  }

  /* ---------- number buttons (one line) ---------- */
  .buttons {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: clamp(4px, 1.2vw, 12px);
    width: 100%;
    max-width: min(820px, 90vh);
    flex-shrink: 0;
    padding-top: 14px;
  }
  .btn {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(.95rem, 3.2vw, 1.7rem);
    aspect-ratio: 1;
    width: 100%;
    border: clamp(2px, .4vw, 3px) solid var(--cap);
    border-radius: 50%;
    cursor: pointer;
    color: var(--night-2);
    line-height: 1;
    background: radial-gradient(circle at 35% 30%, #d8fffd, var(--cyan) 55%, var(--cyan-deep));
    box-shadow: 0 5px 0 var(--cap-deep), 0 0 18px rgba(143, 243, 238, .35);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
    position: relative;
  }
  .btn:nth-child(even) {
    background: radial-gradient(circle at 35% 30%, #e1dcff, #a99fff 55%, var(--cap));
    color: #fff;
    border-color: var(--cyan);
    text-shadow: 0 2px 3px rgba(40, 20, 110, .5);
  }
  .btn:hover { transform: translateY(-4px) scale(1.1) rotate(-6deg); }
  .btn:active { transform: translateY(3px) scale(.95); box-shadow: 0 2px 0 var(--cap-deep); }
  .btn.active {
    outline: 3px dashed var(--star); outline-offset: 3px; transform: scale(1.1);
    box-shadow: 0 5px 0 var(--cap-deep), 0 0 26px var(--star);
  }
  .btn.active::after {
    content: '⭐';
    position: absolute; top: -0.95em; left: 50%;
    transform: translateX(-50%);
    font-size: .7em;
    text-shadow: none;
    animation: spin 2.5s linear infinite;
  }
  @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

  /* ---------- table card ---------- */
  .card {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 520px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(20, 14, 60, .6);
    backdrop-filter: blur(8px);
    border: 3px solid rgba(143, 243, 238, .55);
    border-radius: 28px;
    padding: clamp(10px, 2vh, 22px) clamp(12px, 3vw, 22px);
    box-shadow: 0 0 40px rgba(125, 111, 240, .45), inset 0 0 30px rgba(143, 243, 238, .08);
    text-align: center;
  }
  .placeholder {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 8px;
    font-size: clamp(1rem, 2.6vh, 1.25rem); font-weight: 600;
  }
  .placeholder .moon { font-size: clamp(2.4rem, 8vh, 4rem); animation: rock 2.4s ease-in-out infinite; }
  @keyframes rock { 50% { transform: translateY(-8px) rotate(-12deg); } }

  .card h2 {
    font-size: clamp(1.2rem, 3.6vh, 2rem);
    line-height: 1.3;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(143, 243, 238, .6);
    margin-bottom: clamp(4px, 1vh, 12px);
    flex-shrink: 0;
  }
  .rows {
    list-style: none;
    flex: 1; min-height: 0;
    display: grid;
    grid-template-rows: repeat(10, 1fr);
    gap: clamp(3px, .8vh, 8px);
  }
  .rows li {
    display: flex; justify-content: space-between; align-items: center;
    min-height: 0;
    background: linear-gradient(90deg, rgba(143, 243, 238, .16), rgba(125, 111, 240, .22));
    border: 1px solid rgba(143, 243, 238, .25);
    border-radius: 999px;
    padding: 0 clamp(12px, 3vw, 22px);
    font-size: clamp(.85rem, 2.5vh, 1.3rem);
    font-weight: 600;
    opacity: 0;
    transform: translateY(-14px) scale(.9);
    animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards;
    cursor: pointer;
    transition: background .2s;
  }
  .rows li:hover { background: linear-gradient(90deg, rgba(143, 243, 238, .3), rgba(125, 111, 240, .38)); }
  .rows li .ans {
    background: linear-gradient(135deg, var(--cap), var(--cap-deep));
    color: #fff;
    border: 2px solid var(--cyan);
    border-radius: 999px;
    min-width: 3.4em;
    padding: .02em .8em;
    font-weight: 700;
  }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .hidden-mode .rows li .ans { font-size: 0; }
  .hidden-mode .rows li .ans::before { content: '💤'; font-size: clamp(.85rem, 2.5vh, 1.3rem); }
  .hidden-mode .rows li.shown .ans { font-size: inherit; }
  .hidden-mode .rows li.shown .ans::before { content: none; }

  .toggle {
    flex-shrink: 0; align-self: center;
    margin-top: clamp(6px, 1.4vh, 14px);
    font-family: inherit; font-weight: 700;
    font-size: clamp(.8rem, 2vh, 1rem);
    border: 2px solid var(--cyan);
    border-radius: 999px;
    padding: .5em 1.4em;
    background: linear-gradient(90deg, var(--cap-deep), var(--cap));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 #2e2387, 0 0 14px rgba(143, 243, 238, .35);
  }
  .toggle:active { transform: translateY(2px); }

  footer {
    text-align: center; font-weight: 600;
    font-size: clamp(.72rem, 1.7vh, .92rem);
    color: #c9c2ff;
    position: relative; z-index: 1; flex-shrink: 0;
  }

  .burst {
    position: fixed; pointer-events: none; z-index: 10;
    font-size: 20px;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
</style>
</head>

      <h1>Astro's Starry<br>Tables</h1>
      <div class="bubble" id="bubble">🌙 Pick a number, sleepyhead!</div>
    </div>
  </header>

  <div class="buttons" id="buttons"></div>

  <div class="card" id="card">
    <div class="placeholder">
      <span class="moon">🌙</span>
      Tap a star button to wake up a table! ✨
    </div>
  </div>

  <footer>💤 Nap Time! Astro restores your brain-stamina ⭐</footer>

<script>
  const ASTRO = document.getElementById('astro').src;
  const sky = ['⭐','🌙','✨','💫','🌟','💤','☁️','🪐','🌠','💙'];
  const lines = [
    'Nap Time! ✨', 'Well rested & ready! 💙', 'Star pillows collected! ⭐',
    'Shh... counting stars 🌙', 'Stamina restored! 💫', 'Sweet dreams of numbers 🌟',
    'Twinkle twinkle! ✨', 'Sleepy but smart! 💤', 'To the moon! 🪐', 'You did it, superstar! 🌠'
  ];
  const buttons = document.getElementById('buttons');
  const card = document.getElementById('card');
  const bubble = document.getElementById('bubble');
  let quizMode = false;
  let current = null, currentBtn = null;

  for (let n = 1; n <= 10; n++) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = n;
    b.setAttribute('aria-label', 'Show table of ' + n);
    b.addEventListener('click', e => { showTable(n, b); burst(e.clientX, e.clientY); });
    buttons.appendChild(b);
  }

  document.getElementById('astro').addEventListener('click', e => {
    bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
    burst(e.clientX, e.clientY);
  });

  function showTable(n, btn) {
    current = n; currentBtn = btn;
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    bubble.textContent = `Table of ${n}! ${lines[n - 1]}`;
    let html = `<h2>🌙 Table of ${n} ⭐</h2><ul class="rows">`;
    for (let i = 1; i <= 10; i++) {
      html += `<li style="animation-delay:${i * 0.06}s">
        <span>${n} × ${i} =</span>
        <span class="ans">${n * i}</span>
      </li>`;
    }
    html += `</ul><button class="toggle" id="toggle">${quizMode ? '☀️ Wake up all answers' : '💤 Quiz me (answers sleep)'}</button>`;
    card.innerHTML = html;
    card.classList.toggle('hidden-mode', quizMode);

    card.querySelectorAll('.rows li').forEach(li => {
      li.addEventListener('click', e => {
        if (quizMode && !li.classList.contains('shown')) {
          li.classList.add('shown');
          burst(e.clientX, e.clientY);
        }
      });
    });
    document.getElementById('toggle').addEventListener('click', () => {
      quizMode = !quizMode;
      showTable(current, currentBtn);
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'burst';
      s.textContent = ['⭐','✨','🌙','💫','🌟'][Math.floor(Math.random() * 5)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  // twinkling stars
  for (let i = 0; i < 60; i++) {
    const t = document.createElement('div');
    t.className = 'twinkle';
    t.textContent = Math.random() < .7 ? '✦' : '·';
    t.style.left = Math.random() * 100 + 'vw';
    t.style.top = Math.random() * 100 + 'vh';
    t.style.fontSize = 6 + Math.random() * 14 + 'px';
    t.style.animationDuration = 1.5 + Math.random() * 3 + 's';
    t.style.animationDelay = -Math.random() * 4 + 's';
    document.body.appendChild(t);
  }

  // shooting stars
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div');
    s.className = 'shooting';
    s.style.left = 50 + Math.random() * 50 + 'vw';
    s.style.top = Math.random() * 40 + 'vh';
    s.style.animationDelay = i * 2.4 + Math.random() * 2 + 's';
    document.body.appendChild(s);
  }

  // floating moons, stars, zzz and mini sleepy Astros
  for (let i = 0; i < 24; i++) {
    const f = document.createElement('div');
    f.className = 'float';
    f.style.left = Math.random() * 96 + 'vw';
    f.style.animationDuration = 14 + Math.random() * 14 + 's';
    f.style.animationDelay = -Math.random() * 28 + 's';
    let el;
    if (i % 4 === 0) {
      el = document.createElement('img');
      el.src = ASTRO;
      el.alt = '';
      f.style.width = 28 + Math.random() * 22 + 'px';
    } else {
      el = document.createElement('span');
      el.textContent = sky[i % sky.length];
      el.style.fontSize = 16 + Math.random() * 20 + 'px';
    }
    el.style.animationDuration = 2 + Math.random() * 2 + 's';
    f.appendChild(el);
    document.body.appendChild(f);
  }
</script>
</body>
</html>
